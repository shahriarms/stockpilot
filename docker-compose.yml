
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockpilot_app
    ports:
      - "3000:3000"
    environment:
      POSTGRES_URL: postgresql://user:password@db:5432/stockpilot_db
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15-alpine
    container_name: stockpilot_db
    environment:
      POSTGRES_DB: stockpilot_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d stockpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: stockpilot_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@stockpilot.com"
      PGADMIN_DEFAULT_PASSWORD: "password"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: always

volumes:
  postgres_data:
  pgadmin_data:

